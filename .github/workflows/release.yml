name: package-skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 与 scripts/ 下脚本的实测最低版本一致（Python 3.9 已验证通过）
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # 用 `python -m pip` 而不是裸 `pip`：保证装进 setup-python 选定的解释器，
        # 避免 PATH 上出现别的 pip 时装错地方
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Show toolchain
        # CI 挂掉时第一眼要看的就是版本，先打出来
        run: |
          python -VV
          python -c "import docx, sys; print('python-docx', docx.__version__ if hasattr(docx,'__version__') else 'ok'); print(sys.executable)"

      - name: Run smoke tests
        run: python scripts/tests/test_smoke.py

      - name: Package skill
        run: python scripts/package_skill.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
